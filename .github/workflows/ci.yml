name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check rates_brief tests
      - run: uv run --frozen ruff format --check rates_brief tests
      - run: uv run --frozen mypy rates_brief
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m rates_brief.evaluate --output outputs/evaluation.json
      - run: docker build -t rates-brief .
      - run: docker run --rm rates-brief --user jim --as-of 2026-10-28 --output /tmp/jim.md
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: outputs/evaluation.*
